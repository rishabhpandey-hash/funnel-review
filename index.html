<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Funnel review</title>
<!--
  Funnel review — how every outbound campaign is doing, on one page, in words
  anyone can read without a walkthrough. This page holds no data: after email
  sign-in it asks the funnel-review edge function (Supabase ops project).
  Numbers, verdicts and the wording of each reason: control-tower
  backend/ops/supabase/migrations/20260929_*_funnel_review_*.sql
-->
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#101828;--muted:#475467;--soft:#667085;--line:#e4e7ec;
  --accent:#3538cd;--accent-bg:#eef4ff;
  --red:#b42318;--red-bg:#fef3f2;--red-dot:#f04438;
  --amber:#b54708;--amber-bg:#fffaeb;--amber-dot:#f79009;
  --green:#067647;--green-bg:#ecfdf3;--green-dot:#17b26a;
  --grey:#475467;--grey-bg:#f2f4f7;--grey-dot:#98a2b3;
  /* Always light, whatever the viewer's system setting (Rishabh, 2026-09-29). */
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:24px;margin:0;font-weight:700}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0;font-weight:650}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--soft)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{padding:4px 10px;font-size:14px}
input,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 11px;min-width:0}
.muted{color:var(--muted)}.soft{color:var(--soft)}.small{font-size:14px}
.section{margin-top:30px}
.section > h2{margin-bottom:4px}
.section > .sub{color:var(--muted);font-size:15px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top .right{display:flex;gap:8px;align-items:center}
.when{color:var(--muted);margin-top:4px}
.banner{border-radius:12px;padding:12px 16px;margin-top:16px;font-size:15px}
.banner.info{background:var(--accent-bg);color:var(--accent)}
.banner.err{background:var(--red-bg);color:var(--red)}
.banner.alert{background:var(--red-bg);color:var(--red);font-weight:600}
.banner.alert a{color:var(--red)}
/* big numbers */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-size:30px;font-weight:700;line-height:1.15}
.tile span{font-size:14px;color:var(--muted)}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* overview */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.d-red{background:var(--red-dot)}.d-amber{background:var(--amber-dot)}.d-green{background:var(--green-dot)}.d-grey{background:var(--grey-dot)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:14px;padding:16px 18px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:none}
.row .dot{margin-top:7px;width:14px;height:14px}
.row .name{font-weight:650;font-size:17px}
.row .name a{color:var(--ink);text-decoration:none}
.row .name a:hover{text-decoration:underline}
.row .why{margin-top:3px}
.row .todo{margin-top:6px;font-size:15px}
.row .todo b{font-weight:650}
.chan{font-size:13px;color:var(--soft);font-weight:400;margin-left:6px}
.pill{font-size:14px;font-weight:650;padding:4px 12px;border-radius:999px;white-space:nowrap}
.v-red{background:var(--red-bg);color:var(--red)}.v-amber{background:var(--amber-bg);color:var(--amber)}
.v-green{background:var(--green-bg);color:var(--green)}.v-grey{background:var(--grey-bg);color:var(--grey)}
@media (max-width:560px){.row{grid-template-columns:14px minmax(0,1fr)}.row .pill{grid-column:2;justify-self:start}}
/* detail cards */
.detail{margin-top:14px}
.detail .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.step{background:var(--grey-bg);border-radius:12px;padding:12px 14px;position:relative}
.step b{display:block;font-size:26px;font-weight:700;line-height:1.15}
.step span{font-size:14px;color:var(--muted)}
.step:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:16px}
@media (max-width:600px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.step::after{display:none}}
.extra{font-size:15px;color:var(--muted);margin-top:10px}
.checks{margin-top:14px;display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:baseline}
.mark{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;transform:translateY(4px)}
.m-green{background:var(--green-bg);color:var(--green)}.m-amber{background:var(--amber-bg);color:var(--amber)}.m-red{background:var(--red-bg);color:var(--red)}
.note{background:var(--accent-bg);color:var(--accent);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
details{margin-top:14px}
details summary{cursor:pointer;color:var(--accent);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--soft);font-weight:600;border-top:none}
.tablewrap{overflow-x:auto}
/* to-do */
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:none}
.act .t{flex:1}
.tag{font-size:13px;background:var(--grey-bg);color:var(--grey);border-radius:6px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.addrow{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) minmax(0,1.5fr) auto;gap:8px;margin-top:14px}
@media (max-width:640px){.addrow{grid-template-columns:1fr}}
.center{max-width:420px;margin:12vh auto;text-align:center}
.center .card{text-align:left;margin-top:16px}
.center input{width:100%;margin-top:8px}
.center button{width:100%;margin-top:10px}
.msg{margin-top:10px;font-size:15px}.msg.err{color:var(--red)}
.foot{font-size:14px;color:var(--soft)}
.foot li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="soft" style="margin-top:20vh;text-align:center">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://mgnjlymtjmcoskqinhid.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbmpseW10am1jb3NrcWluaGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzMxOTMsImV4cCI6MjEwMDgwOTE5M30.bFMe8wltqHkB7esG_eAYKhU20n2sjPSPp6cEmFoCrco";
const API = SUPABASE_URL + "/functions/v1/funnel-review";
const OWNERS = ["Rishabh", "Kinner", "Subhashree", "Longjam", "George", "Shubhangi", "Nisha", "Naveen", "Sagar"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true },
});

const $root = document.getElementById("root");
let DATA = null, SESSION = null, POLL = null, BUSY = false, PREVIEW = false;

// ---------- plain-language formatting ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = (v) => (v == null || v === "" || isNaN(Number(v)) ? null : Number(v));
const fmt = (v) => (n(v) == null ? "–" : Math.round(n(v)).toLocaleString("en-IN"));
const plural = (v, one, many) => (n(v) === 1 ? one : many);

// 0.05 (%) -> "1 in 2,000". Matches fr_one_in() in the database.
function oneIn(p) {
  p = n(p);
  if (p == null) return "–";
  if (p <= 0) return "none";
  if (p >= 67) return "most";
  const x = 100 / p;
  const r = x < 20 ? Math.round(x) : x < 100 ? Math.round(x / 5) * 5 : x < 1000 ? Math.round(x / 10) * 10 : Math.round(x / 100) * 100;
  return "1 in " + fmt(r);
}
// 125 (hours) -> "5 days". Matches fr_dur().
function dur(h) {
  h = n(h);
  if (h == null) return "–";
  if (h < 1) return "under an hour";
  if (Math.round(h) === 1) return "an hour";
  if (h < 36) return `${Math.round(h)} hours`;
  const d = Math.round(h / 24);
  return `${d} ${d === 1 ? "day" : "days"}`;
}
function ago(ts) {
  if (!ts) return "never";
  const m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} ${h === 1 ? "hour" : "hours"} ago` : `${Math.round(h / 24)} days ago`;
}
const day = (d) => (d ? new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "");

// "B2B — Generic (no personalization data) — Edbound Sales — Jul 2026" -> "B2B · Generic (no personalization data)"
function shortName(name) {
  const parts = String(name || "").split(/\s+[—|]\s+/).map((p) => p.trim()).filter(Boolean);
  const keep = parts.filter((p) => !/^(TEST|Edbound( Sales)?|[A-Z][a-z]{2,8} 20\d\d|20\d\d)$/i.test(p));
  return (keep.length ? keep : parts).join(" · ");
}

const STATUS = { red: "Not working", amber: "Needs attention", green: "Working" };
function statusLabel(f) {
  if (f.verdict && f.verdict !== "grey") return STATUS[f.verdict];
  if (f.status === "launching") return "Not started";
  const m = f.metrics || {};
  if (m.kind === "linkedin" && m.connected === 0) return "Not connected";
  if (m.error) return "Couldn't load";
  return f.verdict ? "Too early" : "No numbers yet";
}

// ---------- API ----------
async function api(path, body) {
  const opts = { headers: { Authorization: "Bearer " + SESSION.access_token } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch { throw new Error("Couldn't reach the dashboard server. Check your connection and try again."); }
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { await signOut("Your session expired. Sign in again."); throw new Error("signed out"); }
  if (res.status === 403) { renderDenied(out.email); throw new Error("denied"); }
  if (!res.ok) throw new Error(out.error || `Request failed (${res.status})`);
  return out;
}

async function load(quiet) {
  if (PREVIEW) return;
  try {
    DATA = await api("/api/review");
    renderApp();
    schedulePoll();
  } catch (e) {
    if (e.message === "signed out" || e.message === "denied") return;
    if (!quiet || !DATA) renderError(e.message);
  }
}

function schedulePoll() {
  clearTimeout(POLL);
  // Poll quickly while a refresh runs; otherwise re-read every 5 minutes (the
  // numbers themselves are rebuilt hourly in the background).
  const wait = DATA && DATA.refreshing ? 15000 : 300000;
  POLL = setTimeout(() => { if (!document.hidden) load(true); else schedulePoll(); }, wait);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && SESSION && DATA) load(true); });

async function refreshNow() {
  if (PREVIEW) return alert("Preview only: nothing is sent.");
  if (BUSY) return; BUSY = true;
  try { await api("/api/refresh", {}); await load(true); }
  catch (e) { if (e.message !== "signed out" && e.message !== "denied") alert(e.message); }
  finally { BUSY = false; }
}

async function action(body) {
  if (PREVIEW) return alert("Preview only: nothing is saved.");
  try { await api("/api/actions", body); await load(true); }
  catch (e) { if (e.message !== "signed out" && e.message !== "denied") alert(e.message); }
}

// ---------- sign in ----------
function renderSignIn(message, isError) {
  $root.innerHTML = `
    <div class="center">
      <h1>How our outreach is doing</h1>
      <p class="muted" style="margin-top:6px">Sign in with your work email.</p>
      <div class="card">
        <label class="small muted" for="em">Email</label>
        <input id="em" type="email" autocomplete="email" placeholder="name@edbound.ai">
        <button class="primary" id="send">Email me a sign-in link</button>
        <div class="msg ${isError ? "err" : ""}" id="msg">${esc(message || "")}</div>
      </div>
    </div>`;
  const em = document.getElementById("em"), msg = document.getElementById("msg"), send = document.getElementById("send");
  const setMsg = (t, err) => { msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); };
  em.oninput = () => setMsg("");
  em.onkeydown = (e) => { if (e.key === "Enter") send.click(); };
  // Sign-in is by link only: the email has no code to type in.
  send.onclick = async () => {
    const email = em.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setMsg("Enter a valid email.", true);
    send.disabled = true;
    setMsg("Sending…");
    const { error } = await sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false },
    });
    send.disabled = false;
    if (error) {
      const m = String(error.message || "");
      if (/signups not allowed|not found|not allowed/i.test(m)) return setMsg("This email doesn't have access. Ask Rishabh to add you.", true);
      if (/security purposes|rate limit|seconds/i.test(m)) return setMsg("You just asked for a link. Wait a minute, then try again.", true);
      return setMsg("Couldn't send the link. Try again in a minute.", true);
    }
    renderLinkSent(email);
  };
}

function renderLinkSent(email) {
  $root.innerHTML = `
    <div class="center">
      <h1>Check your email</h1>
      <div class="card">
        <p>We sent a sign-in link to <b>${esc(email)}</b>.</p>
        <p class="muted" style="margin-top:10px">Open the email and click the link. It brings you back here, signed in. You can close this tab.</p>
        <p class="small soft" style="margin-top:14px">No email after a minute? Check spam, or <a href="#" id="again">send it again</a>.</p>
      </div>
    </div>`;
  document.getElementById("again").onclick = (e) => { e.preventDefault(); renderSignIn(""); document.getElementById("em").value = email; };
}

function renderDenied(email) {
  $root.innerHTML = `
    <div class="center"><h1>How our outreach is doing</h1>
      <div class="card"><p><b>${esc(email || "This email")}</b> doesn't have access to this page.</p>
      <p class="muted small" style="margin-top:8px">Ask Rishabh to add you.</p>
      <button id="out" style="margin-top:14px">Sign in with a different email</button></div></div>`;
  document.getElementById("out").onclick = () => signOut("");
}

function renderError(text) {
  $root.innerHTML = `<div class="center"><h1>How our outreach is doing</h1>
    <div class="banner err">${esc(text)}</div>
    <button id="retry" style="margin-top:12px">Try again</button></div>`;
  document.getElementById("retry").onclick = () => load();
}

async function signOut(note) {
  clearTimeout(POLL);
  await sb.auth.signOut().catch(() => {});
  SESSION = null; DATA = null;
  renderSignIn(note);
}

// ---------- page ----------
function totals(d) {
  const t = { emails: 0, liMsgs: 0, interested: 0, demos: 0, emailWaiting: [], liWaiting: 0, liWaitingList: [] };
  for (const f of d.funnels) {
    const m = f.metrics || {};
    if (m.kind === "email") {
      t.emails += n(m.week?.sent) || 0;
      t.interested += n(m.week?.positive) || 0;
      t.demos += n(m.week?.meetings) || 0;
      for (const x of m.waiting || []) t.emailWaiting.push({ ...x, funnel: f.name });
    } else if (m.kind === "linkedin") {
      t.liMsgs += n(m.week?.messages) || 0;
      t.demos += n(m.week?.demos) || 0;
      t.liWaiting += n(m.now?.waiting_48h) || 0;
      for (const x of m.waiting || []) t.liWaitingList.push({ ...x, funnel: f.name });
    }
  }
  t.emailWaiting.sort((a, b) => (n(b.waiting_h) || 0) - (n(a.waiting_h) || 0));
  t.liWaitingList.sort((a, b) => (n(a.waiting_h) || 0) - (n(b.waiting_h) || 0));
  return t;
}

function renderApp() {
  const d = DATA, t = totals(d), w = d.window || {};
  const target = n(d.demos_target) || 5;
  const oldest = t.emailWaiting[0];

  $root.innerHTML = `
    <div class="top">
      <div>
        <h1>How our outreach is doing</h1>
        <p class="when">${d.built_at ? `Last 7 days (${esc(day(w.start))} to ${esc(day(w.end))}) · updated ${esc(ago(d.built_at))}` : "Collecting the first numbers…"}</p>
      </div>
      <div class="right">
        <button class="small" id="refresh" ${d.refreshing ? "disabled" : ""}>${d.refreshing ? "Updating…" : "Update now"}</button>
        <button class="small" id="signout" title="${esc(d.me?.email || "")}">Sign out</button>
      </div>
    </div>
    ${d.refreshing ? `<div class="banner info">Updating the numbers (${fmt(d.refreshing.total - d.refreshing.left)} of ${fmt(d.refreshing.total)} done). The page changes by itself when it's finished, in about 10 minutes.</div>` : ""}
    ${d.built_at ? `
    <div class="tiles">
      <div class="tile"><b>${fmt(t.emails)}</b><span>emails sent</span></div>
      <div class="tile"><b>${fmt(t.liMsgs)}</b><span>LinkedIn messages sent</span></div>
      <div class="tile"><b>${fmt(t.interested)}</b><span>${plural(t.interested, "person", "people")} interested</span></div>
      <div class="tile"><b>${fmt(t.demos)} <span style="font-size:17px">of ${fmt(target)}</span></b><span>demos booked (goal ${fmt(target)} a week)</span></div>
    </div>
    ${t.emailWaiting.length ? `<div class="banner alert">${fmt(t.emailWaiting.length)} ${plural(t.emailWaiting.length, "person replied by email and is", "people replied by email and are")} waiting for our answer. The longest wait is ${esc(dur(oldest.waiting_h))}. <a href="#waiting">See who</a></div>` : ""}

    <div class="section">
      <h2>Each campaign at a glance</h2>
      <p class="sub">What's wrong, and the one thing to do about it.</p>
      <div class="legend">
        <span><i class="dot d-green"></i>Working</span><span><i class="dot d-amber"></i>Needs attention</span>
        <span><i class="dot d-red"></i>Not working</span><span><i class="dot d-grey"></i>Not started or no numbers</span>
      </div>
      <div class="rows">${d.funnels.map(overviewRow).join("")}</div>
    </div>

    <div class="section">
      <h2>The numbers behind each campaign</h2>
      <p class="sub">Last 7 days, and how it compares with a good campaign.</p>
      ${d.funnels.map(detailCard).join("")}
    </div>

    ${waitingSection(t)}
    ${todoSection(d)}
    ${howSection()}` : ""}`;

  document.getElementById("refresh").onclick = refreshNow;
  document.getElementById("signout").onclick = () => signOut("Signed out.");
  bindActions();
}

function overviewRow(f) {
  const v = f.verdict || "grey";
  return `<div class="row">
    <i class="dot d-${esc(v)}"></i>
    <div>
      <div class="name"><a href="#f-${esc(f.id)}">${esc(f.name)}</a><span class="chan">${f.channel === "email" ? "Email" : "LinkedIn"}</span></div>
      <p class="why">${esc(f.reason || "No numbers yet.")}</p>
      ${f.action ? `<p class="todo"><b>What to do:</b> ${esc(f.action)}
        <button class="small" data-add="${esc(f.id)}" data-text="${esc(f.action)}" style="margin-left:6px">Add to to-do list</button></p>` : ""}
    </div>
    <span class="pill v-${esc(v)}">${esc(statusLabel(f))}</span>
  </div>`;
}

function steps(list) {
  return `<div class="steps">${list.map((s) => `<div class="step"><b>${fmt(s.v)}</b><span>${esc(n(s.v) === 1 ? s.one : s.many)}</span></div>`).join("")}</div>`;
}

// One line per benchmark check, in words. Checks with no data yet are left out.
function checks(gates) {
  const rows = (gates || []).filter((g) => g && g.value != null && g.colour);
  if (!rows.length) return "";
  const mark = { green: "✓", amber: "!", red: "✕" };
  return `<div class="checks">${rows.map((g) => {
    let now, good;
    if (g.metric === "reply_speed_h") { now = `about ${dur(g.value)}`; good = "the same day"; }
    else if (g.metric === "waiting_48h") { now = fmt(g.value); good = "none"; }
    else if (g.higher_is_better) { now = oneIn(g.value); good = oneIn(g.good); }
    // Lower is better here, so "fewer than": 1 in 75 beats a target of 1 in 50.
    else { now = oneIn(g.value); good = `fewer than ${oneIn(g.good)}`; }
    return `<div class="check"><span class="mark m-${esc(g.colour)}">${mark[g.colour]}</span>
      <span><b>${esc(g.label)}:</b> ${esc(now)}. <span class="soft">Good is ${esc(good)}.</span></span></div>`;
  }).join("")}</div>`;
}

function detailCard(f) {
  const m = f.metrics || {}, v = f.verdict || "grey";
  const head = `<div class="head"><h3>${esc(f.name)} <span class="chan">${f.channel === "email" ? "Email" : "LinkedIn"}</span></h3>
    <span class="pill v-${esc(v)}">${esc(statusLabel(f))}</span></div>`;
  let body = "";
  if (f.status === "launching") body = `<p class="extra">${esc(f.reason || f.note || "")}</p>`;
  else if (m.kind === "email") body = emailBody(m);
  else if (m.kind === "linkedin") body = linkedinBody(m);
  else body = `<p class="extra">${esc(f.reason || "No numbers yet.")}</p>`;
  return `<div class="card detail" id="f-${esc(f.id)}">${head}${body}</div>`;
}

function emailBody(m) {
  const wk = m.week || {}, life = m.life || {}, sp = m.speed || {};
  const notes = [];
  if (n(sp.unanswered) > 0) notes.push(`${fmt(sp.unanswered)} interested ${plural(sp.unanswered, "person has", "people have")} never had a reply from us.`);
  if (n(life.left_org) >= 10) notes.push(`${fmt(life.left_org)} people wrote back to say the person we emailed has left. ${fmt(life.names_other)} of these replies give another email address to try.`);
  if (n(life.not_started) > 0) notes.push(`${fmt(life.not_started)} people in these campaigns haven't been emailed yet.`);
  return `
    ${steps([
      { v: wk.sent, one: "email sent", many: "emails sent" },
      { v: wk.human, one: "person replied", many: "people replied" },
      { v: wk.positive, one: "interested", many: "interested" },
      { v: wk.meetings, one: "asked for a meeting", many: "asked for a meeting" },
    ])}
    <p class="extra">Out-of-office and "wrong person" replies aren't counted. Since the start, these campaigns have emailed ${fmt(life.contacted)} people.</p>
    ${checks(m.gates)}
    ${notes.map((x) => `<div class="note">${esc(x)}</div>`).join("")}
    <details><summary>More detail</summary>
      <div class="tablewrap"><table>
        <tr><th>Campaign</th><th>Emailed since the start</th><th>Last 7 days</th><th>Interested since the start</th></tr>
        ${(m.campaigns || []).map((c) => `<tr>
          <td>${esc(shortName(c.name))}<div class="small soft">${esc((c.status || "").toLowerCase())}</div></td>
          <td>${fmt(c.contacted)}${n(c.not_started) ? `<div class="small soft">${fmt(c.not_started)} not emailed yet</div>` : ""}</td>
          <td>${fmt(c.sent_7d)} sent · ${fmt(c.human_7d)} replied · ${fmt(c.positive_7d)} interested</td>
          <td>${fmt(c.positive_life)} (${esc(oneIn(c.positive_pct))})</td></tr>`).join("")}
      </table></div>
      ${failedNote(m)}
    </details>`;
}

function linkedinBody(m) {
  const wk = m.week || {}, now = m.now || {};
  const connected = (m.campaigns || []).filter((c) => c.connected);
  const missing = (m.campaigns || []).filter((c) => !c.connected);
  const missNote = missing.length
    ? `<div class="note">Not connected yet: ${missing.map((c) => esc(shortName(c.name))).join(", ")}. Add ${missing.length === 1 ? "it" : "them"} in the LinkedIn inbox admin panel to see ${missing.length === 1 ? "its" : "their"} numbers here.</div>` : "";
  if (!connected.length) return missNote;
  const senders = [];
  for (const c of connected) for (const s of c.senders || []) senders.push(s);
  return `
    ${steps([
      { v: wk.invites, one: "invite sent", many: "invites sent" },
      { v: wk.accepted, one: "accepted", many: "accepted" },
      { v: wk.people_replied, one: "person replied", many: "people replied" },
      { v: wk.demos, one: "demo booked", many: "demos booked" },
    ])}
    <p class="extra">We also sent ${fmt(wk.messages)} ${plural(wk.messages, "message", "messages")}. Right now ${fmt(now.waiting_48h)} ${plural(now.waiting_48h, "person has", "people have")} waited over 2 days for our reply.</p>
    ${checks(m.gates)}
    ${missNote}
    ${senders.length ? `<details><summary>More detail: who sends, and how fast they reply</summary><div class="tablewrap"><table>
      <tr><th>Sent from</th><th>Waiting for their reply</th><th>Their usual reply time</th></tr>
      ${senders.sort((a, b) => (n(b.awaiting) || 0) - (n(a.awaiting) || 0)).map((s) => `<tr><td>${esc(s.name)}</td>
        <td>${fmt(s.awaiting)}</td><td>${esc(s.avg_response ? dur(parseFloat(s.avg_response)) : "–")}</td></tr>`).join("")}
    </table></div>${failedNote(m)}</details>` : failedNote(m)}`;
}

// "Not connected" campaigns are explained in the card. A stale entry means the
// update fell back to the last good value (at most a day old).
function failedNote(m) {
  const list = (m.failed || []).filter((x) => !/No campaign in scope/.test(x.error || ""));
  const stale = list.filter((x) => x.stale).length, failed = list.length - stale;
  const parts = [];
  if (stale) parts.push(`${stale} ${plural(stale, "number", "numbers")} couldn't be updated this time, so the last good ${plural(stale, "value is", "values are")} shown (at most a day old).`);
  if (failed) parts.push(`${failed} ${plural(failed, "number", "numbers")} couldn't be loaded, so some figures may be low.`);
  return parts.length ? `<p class="small soft" style="margin-top:10px">${parts.join(" ")}</p>` : "";
}

function waitingSection(t) {
  const li = t.liWaitingList;
  const recent = li.filter((x) => n(x.waiting_h) <= 30 * 24).length;
  return `<div class="section" id="waiting">
    <h2>People waiting for our reply</h2>
    <p class="sub">They wrote back and haven't heard from us yet.</p>
    <div class="card">
      <h3>By email (${fmt(t.emailWaiting.length)})</h3>
      ${t.emailWaiting.length ? `<div class="tablewrap"><table>
        <tr><th>Who</th><th>Campaign</th><th>Waiting</th></tr>
        ${t.emailWaiting.map((x) => `<tr><td>${esc(x.name)}<div class="small soft">${esc(x.email)}</div></td>
          <td>${esc(x.funnel)}</td><td>${esc(dur(x.waiting_h))}</td></tr>`).join("")}</table></div>`
        : `<p class="muted" style="margin-top:6px">Nobody. Every email reply has been answered.</p>`}
      <h3 style="margin-top:20px">On LinkedIn (${fmt(Math.max(t.liWaiting, li.length))})</h3>
      ${li.length ? `<p class="muted" style="margin-top:6px">${recent === 0
          ? `All of them have waited more than a month, so most have gone cold. Answer the ones that still matter.`
          : `${fmt(recent)} of them wrote in the last month. Start with those.`}</p>
        <details><summary>See the list (most recent first)</summary><div class="tablewrap"><table>
          <tr><th>Who</th><th>Sent from</th><th>Waiting</th></tr>
          ${li.slice(0, 30).map((x) => `<tr><td>${esc(x.name)}${x.company ? `<div class="small soft">${esc(x.company)}</div>` : ""}</td>
            <td>${esc(x.sender)}</td><td>${esc(dur(x.waiting_h))}</td></tr>`).join("")}
        </table></div><p class="small soft" style="margin-top:6px">The LinkedIn inbox has the full list.</p></details>`
        : `<p class="muted" style="margin-top:6px">Nobody has waited more than 2 days.</p>`}
    </div>
  </div>`;
}

function todoSection(d) {
  const funnels = Object.fromEntries(d.funnels.map((f) => [f.id, f.name]));
  const open = d.actions.filter((a) => a.status === "open");
  const week = Date.now() - 7 * 864e5;
  const done = d.actions.filter((a) => a.status !== "open" && new Date(a.done_at || a.created_at).getTime() >= week);
  const row = (a) => `<div class="act">
      <div class="t">${esc(a.text)}${a.funnel_id ? `<span class="tag">${esc(funnels[a.funnel_id] || a.funnel_id)}</span>` : ""}
        <div class="small soft">${a.owner ? `${esc(a.owner)} · ` : ""}${a.status === "open" ? `added ${esc(ago(a.created_at))}` : `${a.status === "done" ? "done" : "dropped"} ${esc(ago(a.done_at))}`}</div></div>
      ${a.status === "open"
        ? `<button class="small" data-status="done" data-id="${esc(a.id)}">Done</button><button class="small" data-status="dropped" data-id="${esc(a.id)}">Drop</button>`
        : `<button class="small" data-status="open" data-id="${esc(a.id)}">Undo</button>`}
    </div>`;
  return `<div class="section" id="todo">
    <h2>To-do list</h2>
    <p class="sub">What we agreed to do. Tick things off when they're done.</p>
    <div class="card">
      <h3>Still to do (${open.length})</h3>
      ${open.length ? open.map(row).join("") : `<p class="muted" style="margin-top:6px">Nothing yet. Use "Add to to-do list" above, or add one here.</p>`}
      <h3 style="margin-top:18px">Done in the last 7 days (${done.length})</h3>
      ${done.length ? done.map(row).join("") : `<p class="muted" style="margin-top:6px">Nothing marked done yet.</p>`}
      <div class="addrow">
        <input id="a-text" placeholder="What needs doing" maxlength="500">
        <input id="a-owner" placeholder="Who" list="owners" maxlength="60">
        <select id="a-funnel"><option value="">Any campaign</option>${d.funnels.map((f) => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("")}</select>
        <button class="primary" id="a-add">Add</button>
      </div>
      <datalist id="owners">${OWNERS.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>
      <div class="msg err" id="a-msg"></div>
    </div>
  </div>`;
}

function howSection() {
  return `<div class="section"><details class="foot"><summary>How these numbers are worked out</summary><ul>
    <li>Everything covers the last 7 days unless it says "since the start". The page updates itself every hour; "Update now" does it straight away (it takes about 10 minutes).</li>
    <li>"Replied" leaves out out-of-office and "wrong person" replies. "Interested" means the reply was tagged Interested, Information Request, Meeting Request or moved to the CRM.</li>
    <li>"How fast we answer" is how long an interested person waited for our first reply. People we never answered count with the time they've waited so far.</li>
    <li>"Emails our mailboxes failed to send" are bounces caused by our own sending accounts, not by bad addresses.</li>
    <li>Demos come from LinkedIn chats tagged Demo Booked, Demo Given or Demo Not Given this week, plus email replies asking for a meeting. Zoho isn't connected yet.</li>
    <li>Each campaign's colour comes from fixed targets, so the same numbers always get the same colour. The worst miss decides the colour and the "what's wrong" line.</li>
  </ul></details></div>`;
}

function bindActions() {
  document.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => action({ op: "add", text: b.dataset.text, funnel_id: b.dataset.add }));
  document.querySelectorAll("[data-status]").forEach((b) => b.onclick = () => action({ op: "status", id: b.dataset.id, status: b.dataset.status }));
  const add = document.getElementById("a-add");
  if (add) add.onclick = () => {
    const text = document.getElementById("a-text").value.trim();
    const msg = document.getElementById("a-msg");
    if (!text) { msg.textContent = "Write what needs doing first."; return; }
    msg.textContent = "";
    action({ op: "add", text, owner: document.getElementById("a-owner").value.trim(), funnel_id: document.getElementById("a-funnel").value });
  };
  const t = document.getElementById("a-text");
  if (t) t.oninput = () => { document.getElementById("a-msg").textContent = ""; };
}

// ---------- boot ----------
// Local preview only: ?preview=<file.json> on localhost renders a saved payload
// without signing in and never calls the live API. Ignored on the live site.
async function boot() {
  const pv = new URLSearchParams(location.search).get("preview");
  if (pv && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    PREVIEW = true;
    DATA = await fetch(pv, { cache: "no-store" }).then((r) => r.json());
    SESSION = { access_token: "preview" };
    renderApp();
    return;
  }
  sb.auth.onAuthStateChange((_e, session) => {
    if (session && !SESSION) { SESSION = session; history.replaceState(null, "", location.pathname); load(); }
    else if (!session && SESSION) { SESSION = null; renderSignIn(""); }
  });
  const { data } = await sb.auth.getSession();
  if (data?.session) { SESSION = data.session; return load(); }
  if (/access_token=|error_description=/.test(location.hash)) {
    setTimeout(() => { if (!SESSION) renderSignIn("That sign-in link has expired or was already used. Request a new one.", true); }, 6000);
    return;
  }
  renderSignIn("");
}
boot();
</script>
